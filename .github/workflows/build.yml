name: Build (compat)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Fetch llama.cpp runtime
        shell: pwsh
        run: pwsh -File ./scripts/fetch-llama-runtime.ps1
      - run: dotnet restore
      - run: dotnet build -c Release --no-restore
