name: Build Superintendent (Windows WPF)

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build Release
        run: dotnet build --configuration Release --no-restore -p:ContinuousIntegrationBuild=true

      - name: Stage llama.cpp runtime
        shell: pwsh
        run: pwsh -File ./tools/Stage-LlamaRuntime.ps1 -OutDir "src/Virgil.App/AI/Runtime" -Version "${{ vars.LLAMA_CPP_VERSION }}" -ZipUrl "${{ vars.LLAMA_CPP_WIN_X64_ZIP_URL }}"

      - name: Publish Virgil.App
        run: dotnet publish src/Virgil.App/Virgil.App.csproj -c Release -o out/Virgil.App

      - name: Verify runtime in publish output
        shell: pwsh
        run: |
          $runtimePath = "out/Virgil.App/AI/Runtime/llama-server.exe"
          if (-not (Test-Path -Path $runtimePath)) {
            throw "Missing runtime in publish output: $runtimePath"
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Virgil.App
          path: out/Virgil.App
