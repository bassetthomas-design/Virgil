name: Windows Build with Llama Runtime

on:
  push:
    branches: [ main, fix/*, feature/* ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Fetch llama.cpp runtime
        shell: pwsh
        run: pwsh -File ./scripts/fetch-llama-runtime.ps1

      - name: Verify runtime help for OpenAI endpoints
        id: llama-help
        shell: pwsh
        run: |
          $runtimePath = "src/Virgil.App/AI/Runtime/llama-server.exe"
          if (-not (Test-Path -Path $runtimePath)) {
            "Runtime not found at $runtimePath" | Out-File -FilePath "llama-server-help.txt" -Encoding utf8
            exit 0
          }
          $output = & $runtimePath --help 2>&1 | Out-String
          $output | Out-File -FilePath "llama-server-help.txt" -Encoding utf8
          exit 0

      - name: Upload llama-server help output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: llama-server-help
          path: llama-server-help.txt

      - name: Restore
        run: dotnet restore

      - name: Build (Release)
        run: dotnet build --configuration Release --no-restore

      - name: Publish
        run: dotnet publish --configuration Release --no-restore --output out

      - name: Copy runtime to Runtime/llama
        shell: pwsh
        run: |
          $source = "out/AI/Runtime/llama-server.exe"
          if (-not (Test-Path -Path $source)) {
            throw "Missing runtime in publish output: $source"
          }
          $destDir = "out/Runtime/llama"
          New-Item -Path $destDir -ItemType Directory -Force | Out-Null
          Copy-Item -Path $source -Destination (Join-Path $destDir "llama-server.exe") -Force

      - name: Create artifact zip
        shell: pwsh
        run: |
          $zipPath = "virgil-app.zip"
          if (Test-Path -Path $zipPath) {
            Remove-Item -Path $zipPath -Force
          }
          Compress-Archive -Path "out/*" -DestinationPath $zipPath

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Virgil App (Windows)
          path: virgil-app.zip
